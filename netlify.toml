# Plain static site: Netlify serves the repository root as-is, no build step.
[build]
  publish = "."
  command = ""

# Launch redirects. ourcommonground.co is the main address; the other domains are
# Netlify domain aliases and send visitors to the matching page. Old Squarespace
# paths go to their closest new page. Host rules must stay above the path-only rules.

[[redirects]]
  from = "https://louisvillepodcast.studio/"
  to = "https://ourcommonground.co/podcast.html"
  status = 301
  force = true

